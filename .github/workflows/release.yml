name: Release
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      json: ${{ steps.record.outputs.json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: dependency-lock
        run: python scripts/release/dependency_lock.py --github-output
      - id: record
        run: |
          python3 scripts/release/version.py --output build/identity.json
          echo "json=$(python3 -c 'import json; print(json.dumps(json.load(open("build/identity.json"))))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-identity
          path: build/identity.json
  verify:
    needs: identity
    uses: ./.github/workflows/build.yml
    with:
      identity: ${{ needs.identity.outputs.json }}
  android-sign:
    needs: identity
    if: vars.FFIDO_PUBLICATION_READY == 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: dependency-lock
        run: python scripts/release/dependency_lock.py --github-output
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ steps.dependency-lock.outputs.java }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.dependency-lock.outputs.flutter }}
          cache: false
          pub-cache: true
      - run: python3 scripts/release/build_identity.py
        env:
          IDENTITY_JSON: ${{ needs.identity.outputs.json }}
      - name: Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FFIDO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FFIDO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FFIDO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          FFIDO_PUBLIC_RELEASE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          export FFIDO_ANDROID_KEYSTORE="$RUNNER_TEMP/ffido-release.jks"
          trap 'rm -f "$FFIDO_ANDROID_KEYSTORE"' EXIT
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["FFIDO_ANDROID_KEYSTORE"]).write_bytes(base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True))'
          chmod 600 "$FFIDO_ANDROID_KEYSTORE"
          (cd apps/frontend && flutter pub get --enforce-lockfile && flutter build apk --release --build-name="$FFIDO_BUILD_NAME" --build-number="$FFIDO_BUILD_NUMBER")
          python3 scripts/release/package.py client android universal --identity build/identity.json --public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-android
          path: build/packages/*
          if-no-files-found: error
  publish:
    needs: [identity, verify, android-sign]
    if: vars.FFIDO_PUBLICATION_READY == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    concurrency:
      group: ffido-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: dependency-lock
        run: python scripts/release/dependency_lock.py --github-output
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '{client-*,server-*-*,signed-android,release-identity}'
          path: build/downloads
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: server-container
          path: build/container
      - name: Validate tested container artifact
        run: |
          (cd build/container && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('build/downloads/release-identity/identity.json').read_text())
          assert json.loads(Path('build/container/identity.json').read_text()) == expected
          PY
      - run: bash scripts/release/linux_packages.sh skopeo
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.dependency-lock.outputs.flutter }}
          channel: stable
          cache: false
          pub-cache: true
      - name: Check Docker Hub scope
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/release/check_dockerhub.py
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Collect this run only
        run: |
          mkdir -p build/packages
          find build/downloads -type f \( -path '*/client-android-universal/*' -o -path '*/release-identity/*' \) -prune -o -type f -exec cp {} build/packages/ \;
      - name: Prepare update signing runtime
        run: |
          python3 -m venv build/update-venv
          build/update-venv/bin/python -m pip install -r scripts/update/requirements.txt
      - name: Publish checked container
        env:
          FFIDO_UPDATE_KEY_ID: ${{ vars.FFIDO_UPDATE_KEY_ID }}
          FFIDO_UPDATE_PRIVATE_KEY: ${{ secrets.FFIDO_UPDATE_PRIVATE_KEY }}
          FFIDO_PUBLICATION_READY: ${{ vars.FFIDO_PUBLICATION_READY }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          build/update-venv/bin/python scripts/release/publish.py build/packages --identity build/container/identity.json --check-only
          python3 scripts/release/container_publish.py build/container/image.tar \
            --identity build/container/identity.json --output build/packages/container.json
          image=$(python3 -c 'import json; d=json.load(open("build/packages/container.json")); print(d["image"]+"@"+d["digest"])')
          docker pull "$image"
          (cd apps/frontend && flutter pub get --enforce-lockfile)
          python3 scripts/release/container_smoke.py "$image"
      - name: Publish complete release
        env:
          FFIDO_UPDATE_KEY_ID: ${{ vars.FFIDO_UPDATE_KEY_ID }}
          FFIDO_UPDATE_PRIVATE_KEY: ${{ secrets.FFIDO_UPDATE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          FFIDO_PUBLICATION_READY: ${{ vars.FFIDO_PUBLICATION_READY }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: build/update-venv/bin/python scripts/release/publish.py build/packages --identity build/downloads/release-identity/identity.json
