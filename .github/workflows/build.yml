name: Verify and package
on:
  workflow_call:
    inputs:
      identity:
        type: string
        default: ''
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  release-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: dependency-lock
        run: python scripts/release/dependency_lock.py --github-output
      - run: python3 -m venv build/update-venv
      - run: build/update-venv/bin/python -m pip install -r scripts/update/requirements.txt
      - run: build/update-venv/bin/python -m unittest discover -s scripts/update -p 'test_*.py' -v
      - run: build/update-venv/bin/python -m unittest discover -s scripts/release -p 'test_*.py' -v
  portable-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: dependency-lock
        run: python scripts/release/dependency_lock.py --github-output
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.dependency-lock.outputs.flutter }}
          channel: stable
          cache: false
          pub-cache: true
      - name: Portable client checks
        working-directory: apps/frontend
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
      - run: python3 scripts/check_dart.py --check
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-${{ steps.dependency-lock.outputs.linux_clang }}
          mkdir -p "$RUNNER_TEMP/format-bin"
          ln -s /usr/bin/clang-format-${{ steps.dependency-lock.outputs.linux_clang }} "$RUNNER_TEMP/format-bin/clang-format"
          PATH="$RUNNER_TEMP/format-bin:$PATH" python3 scripts/check_cpp.py --format-check
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, os: macos, arch: arm64}
          - {runner: macos-15-intel, os: macos, arch: x86_64}
          - {runner: windows-2022, os: windows, arch: x86_64}
          - {runner: ubuntu-24.04, os: linux, arch: x86_64}
          - {runner: ubuntu-24.04, os: android, arch: universal}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: dependency-lock
        run: python scripts/release/dependency_lock.py --github-output
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.dependency-lock.outputs.python }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.os == 'android'
        with:
          distribution: temurin
          java-version: ${{ steps.dependency-lock.outputs.java }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.dependency-lock.outputs.flutter }}
          channel: stable
          cache: false
          pub-cache: true
      - name: Linux client tools
        if: matrix.os == 'linux'
        run: |
          # Match backend setup: the Azure mirror throttles package downloads.
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -E -i 's@https?://azure\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' "$source"
            fi
          done
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb
      - run: python scripts/release/build_identity.py
        env:
          IDENTITY_JSON: ${{ inputs.identity }}
      - working-directory: apps/frontend
        run: |
          flutter pub get --enforce-lockfile
          flutter test --no-pub
      - name: Build client
        working-directory: apps/frontend
        env:
          TARGET: ${{ matrix.os }}
        run: |
          if [[ "$TARGET" == android ]]; then
            flutter build apk --release --build-name="$FFIDO_BUILD_NAME" --build-number="$FFIDO_BUILD_NUMBER"
          else
            flutter build "$TARGET" --release --build-name="$FFIDO_BUILD_NAME" --build-number="$FFIDO_BUILD_NUMBER"
          fi
      - name: Build standalone desktop updater
        if: matrix.os == 'windows' || matrix.os == 'linux'
        run: |
          python -m pip install -r scripts/update/requirements-desktop.txt
          python -m unittest discover -s scripts/update -p 'test_desktop.py' -v
          python scripts/release/desktop_updater.py
      - name: Smoke managed desktop update
        if: matrix.os == 'windows' || matrix.os == 'linux'
        env:
          TARGET: ${{ matrix.os }}
        run: |
          if [[ "$TARGET" == windows ]]; then
            python scripts/update/test_desktop_flow.py --bundle apps/frontend/build/windows/x64/runner/Release --directory build/desktop-update-qa
          else
            xvfb-run -a python scripts/update/test_desktop_flow.py --bundle apps/frontend/build/linux/x64/release/bundle --directory build/desktop-update-qa
          fi
      - name: Upload desktop update diagnostics
        if: always() && (matrix.os == 'windows' || matrix.os == 'linux')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-update-qa-${{ matrix.os }}
          path: build/desktop-update-qa/
          if-no-files-found: ignore
      - name: Package
        env:
          TARGET: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: python scripts/release/package.py client "$TARGET" "$ARCH" --identity build/identity.json
      - name: Smoke packaged client
        run: python scripts/release/smoke.py client-${{ matrix.os }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-${{ matrix.os }}-${{ matrix.arch }}
          path: build/packages/*
          if-no-files-found: error
  android-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: dependency-lock
        run: python scripts/release/dependency_lock.py --github-output
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ steps.dependency-lock.outputs.java }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.dependency-lock.outputs.flutter }}
          channel: stable
          cache: false
          pub-cache: true
      - working-directory: apps/frontend
        run: flutter pub get --enforce-lockfile
      - name: Prepare QA APK A and B once
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          python3 scripts/update/test_android_flow.py --prepare-only --flutter "$(command -v flutter)" --sdk "$ANDROID_HOME" --directory build/android-fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-fixtures
          path: |
            build/android-fixtures/www/
            build/android-fixtures/fixtures.json
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-fixture-build-logs
          path: build/android-fixtures/*.log
          retention-days: 2
          if-no-files-found: ignore
  android-qa:
    needs: [client, android-fixtures]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [24, 25, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: dependency-lock
        run: python scripts/release/dependency_lock.py --github-output
      - id: sdk
        run: echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.sdk.outputs.root }}/emulator
          key: android-emulator-${{ steps.dependency-lock.outputs.android_emulator_key }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.sdk.outputs.root }}/${{ steps.dependency-lock.outputs[format('android_{0}_path', matrix.api)] }}
          key: android-image-${{ steps.dependency-lock.outputs[format('android_{0}_key', matrix.api)] }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: client-android-universal
          path: build/packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-fixtures
          path: build/android-fixtures
      - name: Packaged launch and real system update
        env:
          FFIDO_ANDROID_SMOKE_API: ${{ matrix.api }}
          FFIDO_ANDROID_FIXTURES: ${{ github.workspace }}/build/android-fixtures
        run: bash scripts/release/android_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-qa-api${{ matrix.api }}
          path: |
            build/android-update-qa-api${{ matrix.api }}/*.json
            build/android-update-qa-api${{ matrix.api }}/*.log
            ${{ runner.temp }}/ffido-emulator.log
          if-no-files-found: ignore
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: x86_64}
          - {runner: macos-15, os: macos, arch: arm64}
          - {runner: macos-15-intel, os: macos, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: dependency-lock
        run: python scripts/release/dependency_lock.py --github-output
      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          # Azure's Ubuntu mirror has stalled while downloading LLVM packages.
          # Use the official archive, retaining Ubuntu signatures and package versions.
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors*.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -E -i 's@https?://azure\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' "$source"
            fi
          done
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y clang-${{ steps.dependency-lock.outputs.linux_clang }} clang-tidy-${{ steps.dependency-lock.outputs.linux_clang }} ninja-build libssl-dev libc-ares-dev libre2-dev zlib1g-dev patchelf pkg-config
          echo 'CC=clang-${{ steps.dependency-lock.outputs.linux_clang }}' >> "$GITHUB_ENV"
          echo 'CXX=clang++-${{ steps.dependency-lock.outputs.linux_clang }}' >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/llvm-bin"
          ln -s /usr/bin/clang-tidy-${{ steps.dependency-lock.outputs.linux_clang }} "$RUNNER_TEMP/llvm-bin/clang-tidy"
          echo "$RUNNER_TEMP/llvm-bin" >> "$GITHUB_PATH"
      - name: macOS tools
        if: runner.os == 'macOS'
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_${{ steps.dependency-lock.outputs.xcode }}.app/Contents/Developer
          xcodebuild -version
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_UPGRADE=1 brew install cmake ninja llvm openssl@3 c-ares re2 pkgconf
          {
            echo "$(brew --prefix llvm)/bin"
            echo "$(brew --prefix openssl@3)/bin"
          } >> "$GITHUB_PATH"
          {
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "MACOSX_DEPLOYMENT_TARGET=15.0"
            echo "CC=$(xcrun --find clang)"
            echo "CXX=$(xcrun --find clang++)"
            echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3):$(brew --prefix c-ares):$(brew --prefix re2)"
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix c-ares)/lib/pkgconfig:$(brew --prefix re2)/lib/pkgconfig"
          } >> "$GITHUB_ENV"
      - name: Pinned backend Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.dependency-lock.outputs.python }}
          cache: pip
          cache-dependency-path: scripts/update/requirements.txt
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.dependency-lock.outputs.flutter }}
          cache: false
          pub-cache: true
      - uses: ./.github/actions/native-dependencies
        id: native
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/compiler-cache-tool/prefix
          key: compiler-cache-tool-v1-${{ steps.native.outputs.toolchain }}-${{ steps.dependency-lock.outputs.compiler_cache_key }}-${{ hashFiles('scripts/release/compiler_cache.sh') }}
      - run: bash scripts/release/compiler_cache.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/compiler-cache
          key: compiler-v1-${{ steps.native.outputs.toolchain }}-${{ steps.dependency-lock.outputs.compiler_cache_key }}-${{ github.sha }}
          restore-keys: |
            compiler-v1-${{ steps.native.outputs.toolchain }}-${{ steps.dependency-lock.outputs.compiler_cache_key }}-
      - name: Configure compiler cache
        run: |
          {
            echo "CCACHE_DIR=$PWD/build/compiler-cache"
            echo "CCACHE_BASEDIR=$PWD"
            echo "CCACHE_COMPILERCHECK=content"
            echo 'CCACHE_MAXSIZE=500M'
          } >> "$GITHUB_ENV"
      - run: python3 scripts/release/build_identity.py
        env:
          IDENTITY_JSON: ${{ inputs.identity }}
      - name: Configure and build
        run: |
          cmake -S . -B build/backend -C build/release-deps/prefix/ffido-cache.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython3_EXECUTABLE="$(command -v python3)" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/backend --parallel 3
      - run: ccache --show-stats
      - name: Test including HPT
        run: FFIDO_TEST_HPT="$PWD/build/release-deps/prefix/bin/hpt" python3 scripts/release/check_ctest.py build/backend
      - name: Compute complete platform analysis inputs
        id: analysis-inputs
        run: python3 scripts/release/analysis_cache.py key
      - name: Preserve complete analysis inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: analysis-inputs-${{ matrix.os }}-${{ matrix.arch }}
          path: build/analysis/inputs.json
          if-no-files-found: ignore
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: analysis-cache
        with:
          path: build/analysis/result
          key: analysis-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.analysis-inputs.outputs.key }}
      - name: C++ checks
        run: python3 scripts/release/analysis_cache.py run
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.analysis-cache.outputs.cache-hit != 'true'
        with:
          path: build/analysis/result
          key: analysis-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.analysis-inputs.outputs.key }}
      - name: Contract generation
        run: |
          (cd tools/proto && dart pub get --enforce-lockfile)
          PROTOC="$PWD/build/release-deps/prefix/bin/protoc" tools/proto/generate.sh --check
      - name: Package server
        env:
          TARGET: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/release/package.py server "$TARGET" "$ARCH" --identity build/identity.json
      - name: Smoke packaged server and TLS client
        run: |
          python3 -m venv build/server-update-tools
          build/server-update-tools/bin/pip install -r scripts/update/requirements.txt
          build/server-update-tools/bin/python scripts/release/smoke.py server-${{ matrix.os }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('build/packages/*.package.json') != ''
        with:
          name: ${{ job.status == 'success' && 'server' || 'debug-server' }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/packages/*
          if-no-files-found: error
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: dependency-lock
        run: python scripts/release/dependency_lock.py --github-output
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.dependency-lock.outputs.flutter }}
          channel: stable
          cache: false
          pub-cache: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Expose BuildKit cache runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name} for BuildKit cache`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - run: python3 scripts/release/build_identity.py
        env:
          IDENTITY_JSON: ${{ inputs.identity }}
      - uses: ./.github/actions/docker-native-cache
        id: docker-native
        with:
          operation: prepare
      - name: Build OCI archive and verify remote cache
        run: |
          mkdir -p build/container
          build_args=(
            --platform linux/amd64 --provenance=false
            --build-arg "FFIDO_TEST_RUN=${{ github.run_id }}.${{ github.run_attempt }}"
            --build-arg "FFIDO_REVISION=$(jq -r .sha build/identity.json)"
            --build-arg "FFIDO_VERSION=$(jq -r .version build/identity.json)"
            --build-arg "FFIDO_TAG=$(jq -r .tag build/identity.json)"
            --build-arg "FFIDO_BUILD_NUMBER=$(jq -r .build_number build/identity.json)"
            --build-arg "FFIDO_STABLE=$(jq -r .stable build/identity.json)"
          )
          cache=type=gha,version=2,scope=ffido-server-amd64
          docker buildx build "${build_args[@]}" \
            --cache-from "$cache" --cache-to "$cache,mode=max" \
            --output type=oci,dest=build/container/image.tar .
          # A new daemon has no local layers, so this verifies the exported cache.
          cache_builder=ffido-cache-check
          trap 'docker buildx rm --force "$cache_builder" >/dev/null 2>&1 || true' EXIT
          docker buildx create --name "$cache_builder" --driver docker-container
          timeout 600s docker buildx build --builder "$cache_builder" "${build_args[@]}" \
            --cache-from "$cache" --target builder --output type=cacheonly .
      - uses: ./.github/actions/docker-native-cache
        if: always() && steps.docker-native.outcome == 'success'
        with:
          operation: save
      - name: Smoke the archived image
        run: |
          skopeo copy oci-archive:build/container/image.tar docker-daemon:ffido:check
          (cd apps/frontend && flutter pub get --enforce-lockfile)
          python3 scripts/release/container_smoke.py ffido:check
          cp build/identity.json build/container/identity.json
          (cd build/container && sha256sum image.tar > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-container
          path: build/container/*
          if-no-files-found: error
          compression-level: 0
  metrics:
    if: always()
    needs: [release-tools, portable-checks, client, android-fixtures, android-qa, backend, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100
            });
            fs.mkdirSync('build/ci-metrics', {recursive: true});
            fs.writeFileSync('build/ci-metrics/jobs.json', JSON.stringify(jobs));
      - run: python3 scripts/release/ci_metrics.py build/ci-metrics/jobs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-metrics
          path: build/ci-metrics/
  build-required:
    name: build-required
    if: always()
    needs: [release-tools, portable-checks, client, android-fixtures, android-qa, backend, container, metrics]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failure, cancellation and skips
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PY
