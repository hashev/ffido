name: Verify and package
on:
  workflow_call:
    inputs:
      identity:
        type: string
        default: ''
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  release-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m venv build/update-venv
      - run: build/update-venv/bin/python -m pip install -r scripts/update/requirements.txt
      - run: build/update-venv/bin/python -m unittest discover -s scripts/update -p 'test_*.py' -v
      - run: build/update-venv/bin/python -m unittest discover -s scripts/release -p 'test_*.py' -v
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, os: macos, arch: arm64}
          - {runner: macos-15-intel, os: macos, arch: x86_64}
          - {runner: windows-2022, os: windows, arch: x86_64}
          - {runner: ubuntu-24.04, os: linux, arch: x86_64}
          - {runner: ubuntu-24.04, os: android, arch: universal}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.os == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb
      - run: python scripts/release/build_identity.py
        env:
          IDENTITY_JSON: ${{ inputs.identity }}
      - working-directory: apps/frontend
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - run: python scripts/check_dart.py --check
      - name: Build client
        working-directory: apps/frontend
        env:
          TARGET: ${{ matrix.os }}
        run: |
          if [[ "$TARGET" == android ]]; then
            flutter build apk --release --build-name="$FFIDO_BUILD_NAME" --build-number="$FFIDO_BUILD_NUMBER"
          else
            flutter build "$TARGET" --release --build-name="$FFIDO_BUILD_NAME" --build-number="$FFIDO_BUILD_NUMBER"
          fi
      - name: Build standalone desktop updater
        if: matrix.os == 'windows' || matrix.os == 'linux'
        run: |
          python -m pip install -r scripts/update/requirements-desktop.txt
          python -m unittest discover -s scripts/update -p 'test_desktop.py' -v
          python scripts/release/desktop_updater.py
      - name: Smoke managed desktop update
        if: matrix.os == 'windows' || matrix.os == 'linux'
        env:
          TARGET: ${{ matrix.os }}
        run: |
          if [[ "$TARGET" == windows ]]; then
            python scripts/update/test_desktop_flow.py --bundle apps/frontend/build/windows/x64/runner/Release --directory build/desktop-update-qa
          else
            xvfb-run -a python scripts/update/test_desktop_flow.py --bundle apps/frontend/build/linux/x64/release/bundle --directory build/desktop-update-qa
          fi
      - name: Upload desktop update diagnostics
        if: always() && (matrix.os == 'windows' || matrix.os == 'linux')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-update-qa-${{ matrix.os }}
          path: build/desktop-update-qa/
          if-no-files-found: ignore
      - name: Package
        env:
          TARGET: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: python scripts/release/package.py client "$TARGET" "$ARCH" --identity build/identity.json
      - name: Smoke packaged client
        run: python scripts/release/smoke.py client-${{ matrix.os }}-${{ matrix.arch }}
      - name: Install and launch Android APK
        if: matrix.os == 'android'
        run: |
          bash scripts/release/android_smoke.sh
          for api in 24 25; do
            FFIDO_ANDROID_SMOKE_API="$api" bash scripts/release/android_smoke.sh
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-${{ matrix.os }}-${{ matrix.arch }}
          path: build/packages/*
          if-no-files-found: error
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: x86_64}
          - {runner: macos-15, os: macos, arch: arm64}
          - {runner: macos-15-intel, os: macos, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          # Azure's Ubuntu mirror has stalled while downloading LLVM packages.
          # Use the official archive, retaining Ubuntu signatures and package versions.
          sudo sed -E -i 's@https?://azure\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y clang-19 clang-tidy-19 clang-format-19 ninja-build libssl-dev libc-ares-dev libre2-dev zlib1g-dev patchelf pkg-config
          echo 'CC=clang-19' >> "$GITHUB_ENV"
          echo 'CXX=clang++-19' >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/llvm-bin"
          ln -s /usr/bin/clang-format-19 "$RUNNER_TEMP/llvm-bin/clang-format"
          ln -s /usr/bin/clang-tidy-19 "$RUNNER_TEMP/llvm-bin/clang-tidy"
          echo "$RUNNER_TEMP/llvm-bin" >> "$GITHUB_PATH"
      - name: macOS tools
        if: runner.os == 'macOS'
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          brew install cmake ninja llvm openssl@3 c-ares re2 pkgconf
          {
            echo "$(brew --prefix llvm)/bin"
            echo "$(brew --prefix openssl@3)/bin"
          } >> "$GITHUB_PATH"
          {
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "CC=$(xcrun --find clang)"
            echo "CXX=$(xcrun --find clang++)"
            echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3):$(brew --prefix c-ares):$(brew --prefix re2)"
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix c-ares)/lib/pkgconfig:$(brew --prefix re2)/lib/pkgconfig"
          } >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          cache: true
      - id: native-toolchain
        run: python3 scripts/release/cache_key.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: build/release-deps
          key: native-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.native-toolchain.outputs.key }}-${{ hashFiles('scripts/release/dependencies.sh', 'scripts/release/dependency_record.py', 'scripts/release/cache_key.py', 'cmake/deps.cmake') }}
      - name: Build pinned native dependencies
        env:
          JOBS: '3'
        run: |
          mkdir -p build
          trap 'gzip -f build/native-dependencies.log' EXIT
          if ! bash scripts/release/dependencies.sh > build/native-dependencies.log 2>&1; then
            tail -100 build/native-dependencies.log
            exit 1
          fi
          tail -20 build/native-dependencies.log
      - name: Save completed native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/release-deps
          key: native-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.native-toolchain.outputs.key }}-${{ hashFiles('scripts/release/dependencies.sh', 'scripts/release/dependency_record.py', 'scripts/release/cache_key.py', 'cmake/deps.cmake') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-log-${{ matrix.os }}-${{ matrix.arch }}
          path: build/native-dependencies.log.gz
          if-no-files-found: error
      - run: python3 scripts/release/build_identity.py
        env:
          IDENTITY_JSON: ${{ inputs.identity }}
      - name: Configure and build
        run: |
          cmake -S . -B build/backend -C build/release-deps/prefix/ffido-cache.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/backend --parallel 3
      - name: Test including HPT
        run: FFIDO_TEST_HPT="$PWD/build/release-deps/prefix/bin/hpt" python3 scripts/release/check_ctest.py build/backend
      - name: C++ checks
        run: python3 scripts/check_cpp.py --build-dir build/backend
      - name: Contract generation
        run: |
          (cd tools/proto && dart pub get --enforce-lockfile)
          PROTOC="$PWD/build/release-deps/prefix/bin/protoc" tools/proto/generate.sh --check
      - name: Package server
        env:
          TARGET: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/release/package.py server "$TARGET" "$ARCH" --identity build/identity.json
      - name: Smoke packaged server and TLS client
        run: |
          python3 -m venv build/server-update-tools
          build/server-update-tools/bin/pip install -r scripts/update/requirements.txt
          build/server-update-tools/bin/python scripts/release/smoke.py server-${{ matrix.os }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('build/packages/*.package.json') != ''
        with:
          name: ${{ job.status == 'success' && 'server' || 'debug-server' }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/packages/*
          if-no-files-found: error
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Expose BuildKit cache runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name} for BuildKit cache`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - run: python3 scripts/release/build_identity.py
        env:
          IDENTITY_JSON: ${{ inputs.identity }}
      - name: Build OCI archive and verify remote cache
        run: |
          mkdir -p build/container
          build_args=(
            --platform linux/amd64 --provenance=false
            --build-arg "FFIDO_REVISION=$(jq -r .sha build/identity.json)"
            --build-arg "FFIDO_VERSION=$(jq -r .version build/identity.json)"
            --build-arg "FFIDO_TAG=$(jq -r .tag build/identity.json)"
            --build-arg "FFIDO_BUILD_NUMBER=$(jq -r .build_number build/identity.json)"
            --build-arg "FFIDO_STABLE=$(jq -r .stable build/identity.json)"
          )
          cache=type=gha,version=2,scope=ffido-server-amd64
          docker buildx build "${build_args[@]}" \
            --cache-from "$cache" --cache-to "$cache,mode=max" \
            --output type=oci,dest=build/container/image.tar .
          # A new daemon has no local layers, so this verifies the exported cache.
          cache_builder=ffido-cache-check
          trap 'docker buildx rm --force "$cache_builder" >/dev/null 2>&1 || true' EXIT
          docker buildx create --name "$cache_builder" --driver docker-container
          timeout 600s docker buildx build --builder "$cache_builder" "${build_args[@]}" \
            --cache-from "$cache" --target builder --output type=cacheonly .
      - name: Smoke the archived image
        run: |
          skopeo copy oci-archive:build/container/image.tar docker-daemon:ffido:check
          (cd apps/frontend && flutter pub get --enforce-lockfile)
          python3 scripts/release/container_smoke.py ffido:check
          cp build/identity.json build/container/identity.json
          (cd build/container && sha256sum image.tar > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-container
          path: build/container/*
          if-no-files-found: error
          compression-level: 0
  build-required:
    name: build-required
    if: always()
    needs: [release-tools, client, backend, container]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failure, cancellation and skips
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PY
