name: Pull request CI
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ffido-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    uses: ./.github/workflows/build.yml
  ci-required:
    name: ci-required
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
